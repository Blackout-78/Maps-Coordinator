name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          else
            echo "No signing secrets found: building unsigned."
          fi
          gradle --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Name the APK and hash it
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          VER="${GITHUB_REF_NAME}"
          NAME="Maps-Coordinator-${VER}.apk"
          cp "$SRC" "$NAME"
          sha256sum "$NAME" | tee "${NAME}.sha256"

      - name: Keep the APK for non-release builds
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Maps-Coordinator-apk
          path: Maps-Coordinator-*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Maps-Coordinator-*.apk Maps-Coordinator-*.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Maps Coordinator $GITHUB_REF_NAME" \
              --notes-file "release-notes/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" Maps-Coordinator-*.apk Maps-Coordinator-*.sha256 \
              --title "Maps Coordinator $GITHUB_REF_NAME" \
              --notes-file "release-notes/${GITHUB_REF_NAME}.md"
          fi

      - name: Save the build log on failure
        if: failure()
        run: |
          tail -n 300 "$RUNNER_TEMP/build.log" > /tmp/build-log.txt 2>/dev/null || echo "no build log" > /tmp/build-log.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build-log.txt build-log.txt
          git add build-log.txt
          git commit -m "Build log, run ${{ github.run_number }}"
          git push -f origin build-log
